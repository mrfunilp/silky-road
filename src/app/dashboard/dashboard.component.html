<h1 class="p-6 text-2xl font-semibold text-slate-900">Dashboard</h1>
<button class="bg-red-500 text-white px-4 py-2 rounded-md" type="button" (click)="addItem()">Add Item</button>
<div class="m-6 grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-3">
    @for (item of items(); track item.id){
    <div class="border rounded-lg p-4">
        <p>{{item.name}}</p>
    </div>
    }
</div>
