<div class="xp-page">
  <div class="flex items-center justify-between gap-2">
    <h1 class="text-base font-bold text-xp-blue">Dashboard</h1>
    <div class="flex gap-2">
      <a routerLink="/my-items" class="xp-button no-underline">Manage Your Items</a>
      <button class="xp-button" type="button" (click)="load()" [disabled]="loading()">
        Refresh
      </button>
    </div>
  </div>

  @if (error()) {
    <p class="xp-error-box">{{ error() }}</p>
  }

  <div class="xp-groupbox flex-1">
    <p class="xp-legend mb-2">All Listings ({{ items().length }})</p>

    @if (loading()) {
      <p class="text-sm text-[#555]">Loading...</p>
    } @else if (items().length === 0) {
      <p class="text-sm text-[#555]">This folder is empty.</p>
    } @else {
      <div class="xp-card-grid">
        @for (item of items(); track item.id) {
          <a [routerLink]="['/items', item.id]" class="group block text-black no-underline">
            <app-item-card [item]="item" [badge]="ownedByMe(item) ? 'Yours' : null" />
          </a>
        }
      </div>
    }
  </div>
</div>
