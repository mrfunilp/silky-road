<div class="p-4">
  <div class="mb-3 flex items-center justify-between">
    <h1 class="text-base font-bold text-xp-blue">Dashboard</h1>
    <button class="xp-button" type="button" (click)="addItem()">Add Item</button>
  </div>

  <div class="xp-groupbox">
    <p class="xp-legend mb-2">My Items ({{ items().length }})</p>

    @if (items().length === 0) {
      <p class="text-sm text-[#555]">This folder is empty.</p>
    } @else {
      <div class="grid grid-cols-1 gap-2 sm:grid-cols-2 lg:grid-cols-3">
        @for (item of items(); track item.id) {
          <div class="xp-window p-2">
            <p class="text-sm font-bold">{{ item.name || '(untitled item)' }}</p>
            <p class="text-xs text-[#555]">{{ item.status }}</p>
          </div>
        }
      </div>
    }
  </div>
</div>
