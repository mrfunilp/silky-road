name: silkyroad

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: silkyroad
      POSTGRES_USER: silkyroad
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (copy .env.example)}
    # No ports published: the database is reachable only from the backend over
    # the internal Docker network. Inspect it with: docker compose exec db psql -U silkyroad silkyroad
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U silkyroad -d silkyroad"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    tmpfs: 
      - /tmp:rw
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/silkyroad
      SPRING_DATASOURCE_USERNAME: silkyroad
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SILKYROAD_IMAGES_DIR: /data/images
      SILKYROAD_JWT_SECRET: ${SILKYROAD_JWT_SECRET:?set SILKYROAD_JWT_SECRET in .env (copy .env.example)}
    volumes:
      - item-images:/data/images

  frontend:

    build: .
    depends_on:
      - backend
    read_only: true
    tmpfs: 
      - /tmp:rw
    ports:
      - "8081:8080"

volumes:
  db-data:
  item-images:
