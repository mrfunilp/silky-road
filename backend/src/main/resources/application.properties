spring.application.name=silkyroad-backend


spring.jpa.hibernate.ddl-auto=validate
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
# Password for the restricted silkyroad_app user created in V2__app_user.sql
spring.flyway.placeholders.app_password=${APP_DB_PASSWORD:}
spring.jpa.open-in-view=false

spring.mvc.problemdetails.enabled=false

# Trust X-Forwarded-For from nginx so login rate limiting sees the real client IP and not nginx 
server.forward-headers-strategy=native

silkyroad.jwt.secret=${SILKYROAD_JWT_SECRET}
silkyroad.jwt.ttl-seconds=1800

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

silkyroad.images.dir=./data/images
