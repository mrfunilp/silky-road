spring.application.name=silkyroad-backend

spring.datasource.url=jdbc:h2:mem:silkyroad;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.h2.console.enabled=true

spring.mvc.problemdetails.enabled=false

silkyroad.cors.allowed-origins=http://localhost:4200

silkyroad.jwt.secret=dev-only-insecure-secret-replace-me-32bytes+
silkyroad.jwt.ttl-seconds=43200
