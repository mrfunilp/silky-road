# Layered on top of application.properties when the "test" profile is active
# (see @ActiveProfiles on BackendApplicationTests). Only overrides the JWT
# secret, so the context can start without the SILKYROAD_JWT_SECRET env var.
silkyroad.jwt.secret=test-only-secret-not-used-in-production-32b

# The migrations use Postgres-only SQL (create role), which the in-memory H2
# test database does not understand, so Hibernate builds the tables instead
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop
